[project]
name = "riscv-debug-ui-backend"
version = "0.1.0"
description = "Backend para la UI de Debug RISC-V comunicándose con UART."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pyserial>=3.5",
    "pydantic>=2.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
